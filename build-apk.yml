name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install packages
        run: npm ci

      - name: Create the Android project
        run: npx cap add android

      - name: Make the app icons
        run: npx capacitor-assets generate --android --iconBackgroundColor '#1F3864' --iconBackgroundColorDark '#1F3864'

      - name: Copy the app into the Android project
        run: npx cap sync android

      # The same signing key every time, so a new APK installs over the old one and keeps the saved data.
      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: sports-plus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
