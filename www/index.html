<style>

:root{--bg:#f5f6f8;--c:#fff;--t:#1b2433;--m:#6b7587;--b:#d9dde5;--nv:#1F3864;--ok:#d6f0dc;--good:#2e8b4a;--warn:#b4531a;--bad:#c0392b;--gold:#fff1c2;--girls:#e58aa8;--boys:#5b9be0}

:root[data-theme="dark"]{--bg:#10141b;--c:#1a2029;--t:#e8ecf2;--m:#98a2b3;--b:#2c3542;--nv:#7aa2e6;--ok:#1f3d2a;--good:#5fc17f;--warn:#e8934f;--bad:#ef7b6e;--gold:#3d3416;color-scheme:dark}
*{box-sizing:border-box}

.l1,.l2{display:flex;align-items:center;gap:8px}.l2{margin-top:6px}.l1 input{flex:1;min-width:0}.l2 select{flex:1;min-width:0}.l2 input{width:100px}

.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.opts label{display:flex;gap:6px;align-items:center;font-size:13px}.opts input{width:auto}
.f label.cap{margin:4px 0 0}
details.tm2{background:var(--c);border:1px solid var(--b);border-radius:10px;padding:6px 10px;margin-bottom:8px}details.tm2 summary{cursor:pointer;padding:4px 0;font-size:14px}
.note.ok{border-color:var(--good);color:var(--good)}
.frm{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:10px;margin:10px 0}.frm .hd{text-align:center;font-size:12px;line-height:1.6;margin-bottom:8px}.frm .hd b{display:block;font-size:14px}
.frm .ln{font-size:13px;line-height:1.7}
.chip.aw{border-color:var(--warn);color:var(--warn);background:var(--gold)}

<script>
/*LOGIC*/
const DEF={"U13": [["Girls", "A", "Aninangya Meth", "Woraso Presby", 0], ["Boys", "B", "Bodomase D/A", "Bodomase Meth", 1], ["Girls", "B", "Woraso D/A", "Bodomase Presby", 1], ["Boys", "A", "Woraso D/A", "Bodomase Presby", 0], ["Girls", "B", "Bodomase Meth", "Bodomase D/A", 1], ["Boys", "A", "Woraso D/A", "Bodomase R/C", 0], ["Girls", "B", "Bodomase Presby", "Bodomase Meth", 2], ["Boys", "B", "Aninangya Meth", "Woraso Presby", 1], ["Girls", "A", "Bodomase R/C", "Woraso Presby", 0], ["Boys", "B", "Aninangya Meth", "Bodomase Meth", 2], ["Girls", "B", "Woraso D/A", "Bodomase D/A", 2], ["Boys", "A", "Bodomase R/C", "Bodomase Presby", 0], ["Girls", "B", "Woraso D/A", "Bodomase Meth", 3], ["Boys", "B", "Woraso Presby", "Bodomase D/A", 2], ["Girls", "A", "Aninangya Meth", "Bodomase R/C", 0], ["Boys", "B", "Bodomase Meth", "Woraso Presby", 3], ["Girls", "B", "Bodomase D/A", "Bodomase Presby", 3], ["Boys", "B", "Aninangya Meth", "Bodomase D/A", 3]], "U15": [["Girls", "A", "Bodomase R/C", "Bodomase Meth", 0], ["Boys", "B", "Aninangya Meth", "Woraso D/A", 1], ["Girls", "B", "Bodomase D/A", "Bodomase Presby", 1], ["Boys", "B", "Bodomase D/A", "Bodomase R/C", 1], ["Girls", "B", "Woraso Presby", "Aninangya Meth", 1], ["Boys", "B", "Woraso D/A", "Bodomase D/A", 2], ["Girls", "B", "Bodomase Presby", "Woraso Presby", 2], ["Boys", "A", "Bodomase Presby", "Woraso Presby", 0], ["Girls", "B", "Bodomase D/A", "Aninangya Meth", 2], ["Boys", "A", "Bodomase Presby", "Bodomase Meth", 0], ["Girls", "B", "Bodomase D/A", "Woraso Presby", 3], ["Boys", "B", "Aninangya Meth", "Bodomase R/C", 2], ["Girls", "A", "Woraso D/A", "Bodomase Meth", 0], ["Boys", "B", "Aninangya Meth", "Bodomase D/A", 3], ["Girls", "A", "Bodomase R/C", "Woraso D/A", 0], ["Boys", "B", "Bodomase R/C", "Woraso D/A", 3], ["Girls", "B", "Aninangya Meth", "Bodomase Presby", 3], ["Boys", "A", "Bodomase Meth", "Woraso Presby", 0]]};
const NAME0="Sports Plus+",PTS0=[10,8,6,5,4,3,2,1],ORG0="Sekyere Kumawu District Sports Federation";
const SP={football:{label:"Football",kind:"goals",scorers:1,pen:"Penalty shootout"},handball:{label:"Handball",kind:"goals",scorers:1,pen:"7m throws"},volleyball:{label:"Volleyball",kind:"sets"},athletics:{label:"Athletics",kind:"track"}};
const SPK=Object.keys(SP),AGES=["U13","U15"],ENT=SPK.flatMap(s=>AGES.map(g=>s+":"+g)),REGL="Register";
const KN={SF1:"Semi-final 1",SF2:"Semi-final 2",TP:"Third place",F:"Final"},KO_ORDER=["SF1","SF2","TP","F"],CATS=["Girls","Boys"],GRPS=["A","B"];
const sportOf=a=>a.split(":")[0],ageOf=a=>a.split(":")[1],kindOf=a=>SP[sportOf(a)].kind;
let S={};try{S=JSON.parse(localStorage.getItem("sportsplus1"))||{}}catch(e){S={}}
function norm(d){if(!d||typeof d!="object")d={};
 d.name=typeof d.name=="string"&&d.name.trim()&&!["Circuit Sports Soccer","Circuit Sports","Sports Plus"].includes(d.name)?d.name.trim():NAME0;
 d.org=typeof d.org=="string"&&d.org.trim()?d.org.trim():ORG0;
 if(!d.regmeta||typeof d.regmeta!="object")d.regmeta={};d.regmeta.level=d.regmeta.level=="Inter-school"?"Inter-school":"Inter-circuit";d.regmeta.date=typeof d.regmeta.date=="string"?d.regmeta.date:"";
 d.players=Array.isArray(d.players)?d.players.filter(p=>p&&typeof p=="object"&&p.n).map(p=>({id:+p.id,n:String(p.n),sex:p.sex=="Boys"?"Boys":"Girls",dob:p.dob||"",cls:p.cls||"",nhis:p.nhis||"",team:String(p.team||""),en:Array.isArray(p.en)?p.en.filter(k=>ENT.includes(k)):[]})):[];
 {const ids=new Set();d.players.forEach(p=>{if(!Number.isFinite(p.id)||ids.has(p.id))p.id=Math.max(-1,...d.players.map(q=>q.id).filter(Number.isFinite))+1;ids.add(p.id)})}
 d.awards=Array.isArray(d.awards)?d.awards.filter(w=>w&&ENT.includes(w.a)&&CATS.includes(w.c)&&w.t).map(w=>({id:+w.id,a:w.a,c:w.c,t:String(w.t),pid:w.pid!=null&&w.pid!==""&&Number.isFinite(+w.pid)?+w.pid:null,who:String(w.who||""),team:String(w.team||"")})):[];
 {const ids=new Set();d.awards.forEach(w=>{if(!Number.isFinite(w.id)||ids.has(w.id))w.id=Math.max(-1,...d.awards.map(q=>q.id).filter(Number.isFinite))+1;ids.add(w.id)})}
 d.pts=Array.isArray(d.pts)&&d.pts.length&&d.pts.every(x=>typeof x=="number"&&x>=0)?d.pts:PTS0.slice();
 AGES.forEach(ag=>{if(d[ag]){if(!d["football:"+ag])d["football:"+ag]=d[ag];delete d[ag]}});
 SPK.forEach(sp=>AGES.forEach(ag=>{const a=sp+":"+ag,x=d[a]=d[a]&&typeof d[a]=="object"?d[a]:{};
  if(SP[sp].kind=="track"){x.schools=Array.isArray(x.schools)?x.schools:[];x.events=Array.isArray(x.events)?x.events:[];x.res=x.res||{};return}
  x.r=x.r||{};x.s=Array.isArray(x.s)?x.s:[];x.k=x.k||{};x.tb=x.tb||{};
  if(!Array.isArray(x.fx))x.fx=sp=="football"?DEF[ag].map((f,i)=>({id:i,c:f[0],g:f[1],h:f[2],aw:f[3],rd:f[4]})):[];
  if(!x.teams||typeof x.teams!="object")x.teams={};
  x.fx.forEach(f=>["h","aw"].forEach(p=>{const k=f.c+"|"+f.g,L=x.teams[k]=x.teams[k]||[];if(!L.includes(f[p]))L.push(f[p])}))}));return d}
S=norm(S);
const save=()=>{try{localStorage.setItem("sportsplus1",JSON.stringify(S))}catch(e){}};
const num=v=>(v===""||v==null||isNaN(v))?null:+v;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const clean=n=>String(n||"").trim().replace(/\s+/g," ");
const fx=a=>S[a].fx,fxById=(a,id)=>fx(a).find(f=>f.id===id),pos=(a,id)=>fx(a).findIndex(f=>f.id===id)+1;
const teamsOf=(a,c,g)=>S[a].teams[c+"|"+g]||(S[a].teams[c+"|"+g]=[]);
const hasTeam=(a,c,n)=>GRPS.some(g=>teamsOf(a,c,g).includes(n));
const nameErr=(a,c,n)=>!n?"Type a team name first.":n.includes("|")?'Team names cannot contain "|".':hasTeam(a,c,n)?n+" is already in "+ageOf(a)+" "+c+".":"";
/* results: goals sports (football, handball) and sets sports (volleyball) */
function outG(arr){const [h,g,p,q]=(arr||[]).map(x=>num(x));if(h==null||g==null)return null;
 if(h===g){if(p==null||q==null||p===q)return{pend:1};return{h,g,w:p>q?"HP":"AP"}}
 return{h,g,w:h>g?"H":"A"}}
function outV(arr){const n=(arr||[]).map(v=>num(v));let hs=0,as=0,ph=0,pa=0;const sets=[];
 for(let i=0;i<3&&hs<2&&as<2;i++){const h=n[2*i],g=n[2*i+1];if(h==null||g==null)break;if(h===g)return{pend:1};sets.push(h+"-"+g);ph+=h;pa+=g;if(h>g)hs++;else as++}
 return hs<2&&as<2?null:{h:hs,g:as,ph,pa,w:hs>as?"H":"A",sets}}
const outcome=(sp,arr)=>SP[sp].kind=="sets"?outV(arr):outG(arr);
function scoreStr(sp,arr){const x=outcome(sp,arr);if(!x||x.pend)return"";
 if(SP[sp].kind=="sets")return x.h+"-"+x.g+" ("+x.sets.join(", ")+")";
 return x.h+"-"+x.g+(x.w.length>1?" ("+num(arr[2])+"-"+num(arr[3])+" "+(sp=="handball"?"7m":"pens")+")":"")}
const res=(a,id)=>outcome(sportOf(a),S[a].r[id]);
const PT3={H:[3,0],A:[0,3],HP:[2,1],AP:[1,2]},PT2={H:[2,0],A:[0,2]};
const ptsFor=sp=>SP[sp].kind=="sets"?PT2:PT3;
const same=(a,x,y)=>x.Pts==y.Pts&&x.GD==y.GD&&(kindOf(a)=="sets"?x.PF-x.PA==y.PF-y.PA:x.GF==y.GF);
function table(a,cat,gr){const sp=sportOf(a),V=SP[sp].kind=="sets",P=ptsFor(sp),T={},L=[],pr=S[a].tb[cat+"|"+gr]||[];
 teamsOf(a,cat,gr).forEach(t=>{T[t]={t,P:0,W:0,PW:0,PL:0,L:0,GF:0,GA:0,PF:0,PA:0,Pts:0};L.push(T[t])});
 fx(a).forEach(f=>{if(f.c!=cat||f.g!=gr)return;const r=res(a,f.id);if(!r||r.pend)return;const H=T[f.h],A=T[f.aw],p=P[r.w];if(!H||!A)return;
  H.P++;A.P++;H.GF+=r.h;H.GA+=r.g;A.GF+=r.g;A.GA+=r.h;H.Pts+=p[0];A.Pts+=p[1];
  if(V){H.PF+=r.ph;H.PA+=r.pa;A.PF+=r.pa;A.PA+=r.ph}
  if(r.w=="H"){H.W++;A.L++}else if(r.w=="A"){A.W++;H.L++}else if(r.w=="HP"){H.PW++;A.PL++}else{A.PW++;H.PL++}});
 const rk=n=>{const k=pr.indexOf(n);return k<0?1e3:k};
 return L.map((x,i)=>({...x,GD:x.GF-x.GA,i})).sort((x,y)=>y.Pts-x.Pts||y.GD-x.GD||(V?(y.PF-y.PA)-(x.PF-x.PA):y.GF-x.GF)||rk(x.t)-rk(y.t)||x.i-y.i)}
function groupProg(a,cat,gr){let n=0,d=0;fx(a).forEach(f=>{if(f.c==cat&&f.g==gr){n++;const r=res(a,f.id);if(r&&!r.pend)d++}});return[d,n]}
const groupDone=(a,cat,gr)=>{const[d,n]=groupProg(a,cat,gr);return n>0&&d==n};
function ties(a,cat,gr){const o=[];if(!groupDone(a,cat,gr))return o;const R=table(a,cat,gr);
 for(let i=0;i<2&&i+1<R.length;i++)if(same(a,R[i],R[i+1]))o.push({hi:R[i].t,lo:R[i+1].t,pos:i+1});return o}
function ko(a,cat){const sp=sportOf(a);
 const ready=groupDone(a,cat,"A")&&groupDone(a,cat,"B"),A=table(a,cat,"A"),B=table(a,cat,"B"),pick=(L,i)=>ready&&L[i]?L[i].t:null;
 const M={SF1:{h:pick(A,0),g:pick(B,1),hl:"Group A 1st",gl:"Group B 2nd"},SF2:{h:pick(B,0),g:pick(A,1),hl:"Group B 1st",gl:"Group A 2nd"}};
 const rec=k=>S[a].k[cat+"|"+k],key=k=>M[k].h+"|"+M[k].g;
 const out=k=>{const t=M[k];if(!t.h||!t.g)return null;const r=rec(k);if(!r||r.t!=key(k))return null;const o=outcome(sp,r.r);return o&&!o.pend?o:null};
 const win=k=>{const o=out(k);return o?(o.w[0]=="H"?M[k].h:M[k].g):null},lose=k=>{const o=out(k);return o?(o.w[0]=="H"?M[k].g:M[k].h):null};
 M.F={h:win("SF1"),g:win("SF2"),hl:"Winner SF1",gl:"Winner SF2"};M.TP={h:lose("SF1"),g:lose("SF2"),hl:"Loser SF1",gl:"Loser SF2"};
 KO_ORDER.forEach(k=>{const t=M[k],r=rec(k),good=!!r&&!!t.h&&!!t.g&&r.t==key(k);t.rec=good?r:null;t.stale=!!r&&!good});
 return{ready,M,out,win,lose}}
const logged=(a,m)=>S[a].s.filter(x=>x.m===m).reduce((n,x)=>n+x.g,0);
const mCat=(a,m)=>typeof m=="number"?(fxById(a,m)||{}).c:String(m).split("|")[0];
const mLabel=(a,m)=>{if(typeof m=="number")return"#"+(pos(a,m)||"?");const[c,k]=String(m).split("|");return c+" "+(k=="TP"?"3rd place":k)};
const mParse=v=>/^\d+$/.test(v)?+v:v;
const head=(a,w)=>`${S.name.toUpperCase()} – ${SP[sportOf(a)].label.toUpperCase()} ${ageOf(a)} ${w}\n`;
function koText(a){const sp=sportOf(a);let o=head(a,"KNOCKOUTS");CATS.forEach(c=>{const B=ko(a,c);o+=`\n${c}\n`;
 KO_ORDER.forEach(k=>{const t=B.M[k],x=t.rec?scoreStr(sp,t.rec.r):"";o+=`${KN[k]}: ${t.h||t.hl} ${x||"v"} ${t.g||t.gl}\n`});
 const ch=B.win("F");if(ch)o+=`Champions: ${ch}\n`});return o}
/* team sports setup: every change returns "" or a message for the organiser */
const nextId=a=>Math.max(-1,...fx(a).map(f=>f.id))+1;

function awList(){const q=teamKey(awF.q),W=winners().map(x=>({...x,items:x.items.filter(i=>!awF.e||i.a==awF.e)})).filter(x=>x.items.length&&(!q||teamKey(x.name).includes(q)||teamKey(x.team).includes(q)));

function vRegForm(){const T=knownTeams(),m=S.regmeta;if(!formSel.team||!T.some(t=>teamKey(t)==teamKey(formSel.team)))formSel.team=T[0]||"";
 const[a,cat]=formSel.ev.split("|"),rows=formSel.team?formRows(formSel.team,a,cat):[];
 let h=`<div class="f"><div class="tr"><select data-rm="level" aria-label="Level"><option ${m.level=="Inter-school"?"selected":""}>Inter-school</option><option ${m.level=="Inter-circuit"?"selected":""}>Inter-circuit</option></select><input type="date" data-rm="date" value="${esc(m.date)}" aria-label="Date"></div>
 <input data-rm="org" value="${esc(S.org)}" aria-label="Federation name">
 <select data-fs="ev" aria-label="Event">${ENT.flatMap(k=>CATS.map(c=>`<option value="${k}|${c}" ${formSel.ev==k+"|"+c?"selected":""}>${esc(entLabel(k))} · ${c}</option>`)).join("")}</select>
 <select data-fs="team" aria-label="Team, school or circuit">${T.map(t=>`<option ${t==formSel.team?"selected":""}>${esc(t)}</option>`).join("")}</select></div>`;
 if(!T.length)return $("v").innerHTML=h+'<p class="cap">No teams or players yet. Register a player or add teams in a sport\'s Setup.</p>';
 h+=`<div class="frm"><div class="hd">GHANA EDUCATION SERVICE<b>${esc(S.org.toUpperCase())}</b>REGISTRATION FORM</div><div class="ln">${m.level}${m.date?" · Date: "+fmtD(m.date):""}<br>Event: <b>${esc(entLabel(a))} ${cat}</b><br>Team/School/Circuit: <b>${esc(formSel.team)}</b></div></div>`;
 h+=rows.length?`<div class="tw"><table><tr><th>S/N</th><th>Name</th><th>Date of birth</th><th>Age</th><th>Class</th><th>NHIS card no.</th></tr>`+rows.map((p,i)=>{const g=ageOn(p.dob,m.date);return `<tr><td>${i+1}</td><td>${esc(p.n)}</td><td>${fmtD(p.dob)}</td><td>${g==null?"":g}</td><td>${esc(p.cls)}</td><td>${esc(p.nhis)}</td></tr>`}).join("")+"</table></div>":'<p class="cap">No players registered for this team in this event yet.</p>';
 h+=`<p class="cap">${rows.length} players. Age is worked out on the form date, or today if no date is set.</p>`;
 $("v").innerHTML=h+shareBox("fsh",formText(formSel.team,a,cat),"Copy form to share (WhatsApp)")}
function render(){const reg=sport=="register";$("title").textContent=S.name;
 $("sports").innerHTML=[...SPK,"register"].map(s=>`<button data-sport="${s}" class="${s==sport?"on":""}">${s=="register"?REGL:SP[s].label}</button>`).join("");

 $("nav").innerHTML=tabs.map(x=>`<button data-t="${x[0]}" class="${x[0]==tab?"on":""}">${x[1]}</button>`).join("");

async function copyFrom(id,btn,done){const t=$(id);t.focus();t.select();t.setSelectionRange(0,t.value.length);let ok=false;
 try{await navigator.clipboard.writeText(t.value);ok=true}catch(e){try{ok=document.execCommand("copy")}catch(x){}}
 btn.textContent=ok?done:"Could not copy. The text is selected, so copy it by hand"}
document.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.a,cf=b.dataset.confirm,c=cur();
 if(cf&&armed!==cf){armed=cf;note="";render();return}
 armed="";note="";flash="";
 if(b.dataset.sport){sport=b.dataset.sport;render();scrollTo(0,0)}
 else if(b.dataset.age){age=b.dataset.age;render()}else if(b.dataset.t){tab=b.dataset.t;render();scrollTo(0,0)}
 else if(a=="add"){const p=$("so").checked?"Own goal":$("sp").value.trim(),g=num($("sg").value),t=$("stm").value;if(!p||!g||g<1||!t)return;
  S[c].s.push({m:mParse($("sm").value),p,t,g});save();vScorers()}
 else if(a=="del"){S[c].s.splice(+b.dataset.i,1);save();vScorers()}
 else if(a=="copy"){copyFrom(b.dataset.for,b,b.dataset.done)}
 else if(a=="rest"){let msg;try{const d=JSON.parse($("bk").value);if(d&&(d["football:U13"]||d.U13)){S=norm(d);save();msg="Restored ✓"}else msg="Backup text not valid"}catch(x){msg="Backup text not valid"}
  render();const el=$("bkmsg");if(el)el.textContent=msg}
 else if(a=="tb"){const k=b.dataset.c+"|"+b.dataset.g,w=b.dataset.w,l=b.dataset.l,arr=(S[c].tb[k]||[]).filter(n=>n!=w&&n!=l);arr.push(w,l);S[c].tb[k]=arr;save();render()}
 else if(a=="kdel"){delete S[c].k[b.dataset.ko];save();refreshKO()}
 else if(a=="addteam"){const id="nt-"+b.dataset.c+"-"+b.dataset.g;note=addTeam(c,b.dataset.c,b.dataset.g,$(id).value);save();render();if(!note){const el=$(id);if(el)el.focus()}}
 else if(a=="delteam"){delTeam(c,b.dataset.c,b.dataset.g,b.dataset.t);save();render()}
 else if(a=="gen"){genFx(c,b.dataset.c,b.dataset.g);save();render()}
 else if(a=="mv"){moveFx(c,+b.dataset.id,+b.dataset.d);save();render()}
 else if(a=="delfx"){dropFx(c,+b.dataset.id);save();render()}
 else if(a=="sort"){sortFx(c);save();render()}
 else if(a=="addfx"){const[cat,g]=$("fg").value.split("|");note=addFx(c,cat,g,$("fh").value,$("fa").value,num($("fr").value));save();render()}
 else if(a=="copyteams"){copyTeams(c,b.dataset.from);save();render()}
 else if(a=="clrres"){clearRes(sport);save();render()}
 else if(a=="clrall"){clearAll(sport);save();render()}
 else if(a=="addrow"){const id=evSel[c];(S[c].res[id]=S[c].res[id]||[]).push({ath:"",sch:"",mk:""});save();vAEvents();const L=document.querySelectorAll('[data-f="ath"]');if(L.length)L[L.length-1].focus()}
 else if(a=="delrow"){S[c].res[evSel[c]].splice(+b.dataset.i,1);save();vAEvents()}
 else if(a=="sortrows"){const id=evSel[c],rk=rankEvent(c,aEv(c,id)),rows=S[c].res[id].map((r,i)=>({r,p:rk[i]?rk[i].place:1e9,i}));rows.sort((x,y)=>x.p-y.p||x.i-y.i);S[c].res[id]=rows.map(x=>x.r);save();vAEvents()}
 else if(a=="aaddschool"){note=aAddSchool(c,$("ns").value);save();render();if(!note){const el=$("ns");if(el)el.focus()}}
 else if(a=="adelschool"){aDelSchool(c,b.dataset.s);save();render()}
 else if(a=="aaddev"){note=aAddEvent(c,$("ne").value,$("nec").value,$("net").value);save();render()}

 else if(a=="astd"){aStdEvents(c);save();render()}
 else if(a=="padd"){const e=savePlayer(draft,editId);if(e){note=e}else{const wasEdit=editId!=null,sv=S.players.find(x=>x.id===(wasEdit?editId:Math.max(...S.players.map(q=>q.id))));flash=(wasEdit?"Saved ":"Added ")+sv.n+(wasEdit?"":" to "+sv.team);draft.team=sv.team;
   if(wasEdit){editId=null;draft=newDraft();tab="l"}else{draft.n="";draft.dob="";draft.nhis=""}}
  save();render();if(!note&&tab=="a"){const el=$("pn");if(el)el.focus()}else scrollTo(0,0)}
 else if(a=="pedit"){const p=S.players.find(x=>x.id===+b.dataset.id);if(p){draft={n:p.n,sex:p.sex,dob:p.dob,cls:p.cls,nhis:p.nhis,team:p.team,en:p.en.slice()};editId=p.id;tab="a";render();scrollTo(0,0)}}
 else if(a=="pcancel"){editId=null;draft=newDraft();tab="l";render()}
 else if(a=="pdel"){delPlayer(+b.dataset.id);save();render()}
 else if(a=="pclear"){clearPlayers();save();render()}
 else if(a=="awadd"){const e=saveAward(awDraft);if(e)note=e;else{flash="Added "+clean(awDraft.t)+" for "+clean(awDraft.who);awDraft.t="";awDraft.who="";awDraft.team=""}save();render();if(!note){const el=document.querySelector('[data-aw="t"]');if(el)el.focus()}}

document.addEventListener("change",e=>{const i=e.target,c=cur(),ar=i.closest(".ar");
 if(i.dataset.aw){awDraft[i.dataset.aw]=i.value;if(i.dataset.aw=="ev")render();return}
 if(i.dataset.af){awF[i.dataset.af]=i.value;paintAw();return}
 if(i.dataset.en){const k=i.dataset.en;draft.en=i.checked?[...new Set([...draft.en,k])]:draft.en.filter(x=>x!=k);return}
 if(i.dataset.d!=null){draft[i.dataset.d]=i.value;return}
 if(i.dataset.rf){regF[i.dataset.rf]=i.value;paintList();return}
 if(i.dataset.fs){formSel[i.dataset.fs]=i.value;render();return}
 if(i.dataset.rm){if(i.dataset.rm=="org")S.org=clean(i.value)||ORG0;else S.regmeta[i.dataset.rm]=i.value;save();render();return}
 if(ar&&i.dataset.f){const r=S[c].res[evSel[c]][+ar.dataset.row];if(r){r[i.dataset.f]=i.value;save();paintRanks();
   if(i.dataset.f=="ath"&&!r.sch){const ev=aEv(c,evSel[c]),p=ev&&S.players.find(p=>p.sex==ev.c&&p.en.includes(c)&&teamKey(p.n)==teamKey(i.value)),sc=p&&S[c].schools.find(x=>teamKey(x)==teamKey(p.team));if(sc){r.sch=sc;save();vAEvents();return}}}return}
 if(i.id=="tn"){S.name=clean(i.value)||NAME0;save();render();return}

 if(i.dataset.a=="ren"){note=renameTeam(c,i.dataset.c,i.dataset.g,i.dataset.old,i.value);save();render()}
 else if(i.dataset.a=="aren"){note=aRenSchool(c,i.dataset.old,i.value);save();render()}

document.addEventListener("input",e=>{const i=e.target,a=cur(),ar=i.closest(".ar");

 if(i.dataset.af){awF[i.dataset.af]=i.value;paintAw();return}

 if(ar&&i.dataset.f){const r=S[a].res[evSel[a]][+ar.dataset.row];if(r){r[i.dataset.f]=i.value;save();paintRanks()}return}
 const c=i.closest(".card");if(!c||i.dataset.k==null)return;
 if(c.dataset.ko){const[cat,k]=c.dataset.ko.split("|"),t=ko(a,cat).M[k];if(!t.h||!t.g)return;const kk=cat+"|"+k,tk=t.h+"|"+t.g;
  let r=S[a].k[kk];if(!r||r.t!=tk)r=S[a].k[kk]={t:tk,r:["","","","","",""]};r.r[+i.dataset.k]=i.value;save();refreshKO();return}
 const n=+c.dataset.i,r=S[a].r[n]=S[a].r[n]||["","","","","",""];r[+i.dataset.k]=i.value;save();status(a,n,c)});
render();
